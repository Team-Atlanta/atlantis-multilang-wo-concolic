name: atlantis-multilang-wo-concolic
type:
  - bug-finding
version: 1.0.0
docker_registry: ghcr.io/team-atlanta

prepare_phase:
  hcl: oss-crs/docker-bake.hcl

target_build_phase:
  - name: uniafl-build
    dockerfile: oss-crs/dockerfiles/builder.Dockerfile
    additional_env:
      BUILD_TYPE: uniafl
    outputs:
      - uniafl/build
      - uniafl/src
      - uniafl/project
  - name: coverage-build
    dockerfile: oss-crs/dockerfiles/builder.Dockerfile
    additional_env:
      BUILD_TYPE: coverage
    outputs:
      - coverage/build
  - name: lsp-build
    dockerfile: oss-crs/dockerfiles/lsp_builder.Dockerfile
    outputs:
      - lsp/compile_commands.json
  - name: create-config
    dockerfile: oss-crs/dockerfiles/multilang.Dockerfile
    additional_env:
      RUN_TYPE: CREATE_CONFIG
    outputs:
      - uniafl/config.yaml

crs_run_phase:
  multilang:
    dockerfile: oss-crs/dockerfiles/multilang.Dockerfile
    additional_env:
      # Input generators for fuzzing (comma-separated)
      # Available options:
      #   - given_fuzzer: Use provided seed corpus (default)
      #   - testlang_input_gen: Test language-based input generation
      #   - dict_input_gen: Dictionary-based input generation
      #   - mlla: Multi-language LLM agent for input generation
      CRS_INPUT_GENS: given_fuzzer,mlla,testlang_input_gen,dict_input_gen
  redis:
    dockerfile: oss-crs/dockerfiles/redis.Dockerfile
  init_codeindexer:
    dockerfile: oss-crs/dockerfiles/multilang.Dockerfile
    additional_env:
      RUN_TYPE: INIT_CODEINDEXER
  joern:
    dockerfile: oss-crs/dockerfiles/joern.Dockerfile
  lsp:
    dockerfile: oss-crs/dockerfiles/lsp.Dockerfile

supported_target:
  mode:
    - full
    - delta
  language:
    - c
  sanitizer:
    - address
  architecture:
    - x86_64

required_llms:
  - o4-mini
  - gpt-4o
  - gpt-4o-mini
  - gpt-4.1
  - gpt-4.1-mini
  - claude-sonnet-4-20250514
  - claude-opus-4-20250514
  - claude-3-7-sonnet-20250219
  - claude-3-5-haiku-20241022
  - gemini-2.5-pro
