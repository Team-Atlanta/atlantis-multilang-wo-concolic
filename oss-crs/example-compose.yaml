##############################################################################
#                        CRS Compose Configuration                           #
#        Example for atlantis-multilang-wo-concolic (bug-finding)            #
##############################################################################

# --- General Settings -------------------------------------------------------
run_env: local
docker_registry: local

# --- Infrastructure ---------------------------------------------------------
oss_crs_infra:
  cpuset: "0-3"
  memory: "16G"

# --- CRS (atlantis-multilang-wo-concolic) -----------------------------------
atlantis-multilang-wo-concolic:
  cpuset: "4-15"
  memory: "32G"
  llm_budget: 100

# --- LLM Configuration -----------------------------------------------------
llm_config:
  litellm:
    mode: internal
    internal:
      config_path: ./oss-crs/example-litellm-config.yaml
