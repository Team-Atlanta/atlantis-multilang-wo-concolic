##############################################################################
#                        CRS Compose Configuration                           #
##############################################################################

# --- General Settings -------------------------------------------------------
run_env: local
docker_registry: ghcr.io/my-org/                    # UPDATE

# --- Infrastructure ---------------------------------------------------------
# The oss-crs-infra service is always required.
oss_crs_infra:
  cpuset: "0-3"
  memory: "16G"

# --- CRS (multilang) -------------------------------------------------------
# Configure the CRS source and the resources allocated to it.
multilang:
  source:
    local_path: "UPDATE"                             # local filesystem path pointing to this repo
  cpuset:      "UPDATE"                              # e.g., "4-8"
  memory:      "UPDATE"                              # e.g., "16G", "64G"
  llm_budget:  "UPDATE"                              # e.g., 100, 200 (in USD, must be a number)

# --- LLM Configuration -----------------------------------------------------
llm_config:
  litellm_config: "UPDATE"                           # local filesystem path to litellm config
                                                     # e.g., <repo>/oss-crs/example-litellm-config.yaml
                                                     # You might need to update the litellm config